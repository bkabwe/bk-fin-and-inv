name: Scan Email Medium-Term

on:
  workflow_dispatch:
  schedule:
    # Bi-monthly on the 1st; staggered ahead of grading-report-medium-term.
    - cron: '0 9 1 */2 *'

permissions:
  contents: write

concurrency:
  group: scan-email-medium-term
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  LIGHTGBM_RELEASE_REPOSITORY: ${{ github.repository }}
  POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  SEC_EDGAR_CONTACT_EMAIL: ${{ secrets.SEC_EDGAR_CONTACT_EMAIL }}
  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
  SCAN_EMAIL_RECIPIENTS: ${{ secrets.SCAN_EMAIL_RECIPIENTS }}
  SCAN_EMAIL_FROM: ${{ secrets.SCAN_EMAIL_FROM }}
  WORKFLOW_ALERT_RECIPIENTS: ${{ secrets.WORKFLOW_ALERT_RECIPIENTS }}

jobs:
  scan-email-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache Hugging Face FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-ProsusAI-finbert
      - name: Install dependencies
        run: pip install -r requirements-workflows.txt
      - name: Send medium-term scan email report
        run: python scripts/scan_email_report.py --horizon medium_term
      - name: Persist prediction tracker state
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/predictions.json)" ]; then
            echo "No changes to data/predictions.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          git commit -m "chore: update prediction tracker state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto latest and retrying ($attempt/3)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          git push

  notify-on-failure:
    needs: scan-email-report
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install notifier dependencies
        run: pip install requests
      - name: Send workflow-failure alert
        run: python scripts/notify_workflow_failure.py --workflow "Scan Email Medium-Term"
