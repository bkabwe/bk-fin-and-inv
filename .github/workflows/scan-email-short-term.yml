name: Scan Email Short-Term

on:
  workflow_dispatch:
  schedule:
    # 3h after train-lightgbm-batch (0 6 * * 1) so the promoted manifest is fresh.
    - cron: '0 9 * * 1'

permissions:
  contents: write

concurrency:
  group: scan-email-short-term
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'  # numpy==2.5.3 (requirements-workflows.txt) requires Python 3.12+
  LIGHTGBM_RELEASE_REPOSITORY: ${{ github.repository }}
  POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  SEC_EDGAR_CONTACT_EMAIL: ${{ secrets.SEC_EDGAR_CONTACT_EMAIL }}
  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
  SCAN_EMAIL_RECIPIENTS: ${{ secrets.SCAN_EMAIL_RECIPIENTS }}
  SCAN_EMAIL_FROM: ${{ secrets.SCAN_EMAIL_FROM }}
  WORKFLOW_ALERT_RECIPIENTS: ${{ secrets.WORKFLOW_ALERT_RECIPIENTS }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.discover.outputs.run_date }}
      shard_count: ${{ steps.discover.outputs.shard_count }}
      shard_matrix: ${{ steps.discover.outputs.shard_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements-lightgbm-batch.txt
      - name: Discover live manifest and shared macro inputs
        id: discover
        run: |
          mkdir -p /tmp/scan
          python scripts/scan_email_report.py discover \
            --output-manifest /tmp/scan/manifest.json \
            --output-macro /tmp/scan/macro.joblib \
            | tee /tmp/scan/discover.log \
            | grep -E '^(run_date|shard_count|shard_matrix)=' >> "$GITHUB_OUTPUT"
      - name: Upload scan inputs
        uses: actions/upload-artifact@v4
        with:
          name: scan-inputs
          path: |
            /tmp/scan/manifest.json
            /tmp/scan/macro.joblib

  scan-shard:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.discover.outputs.shard_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache Hugging Face FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-ProsusAI-finbert
      - name: Install dependencies
        run: pip install -r requirements-workflows.txt
      - name: Download scan inputs
        uses: actions/download-artifact@v4.1.3
        with:
          name: scan-inputs
          path: /tmp/scan/inputs
      - name: Scan shard
        run: |
          mkdir -p /tmp/scan/partials
          python scripts/scan_email_report.py scan-shard \
            --horizon short_term \
            --manifest-file /tmp/scan/inputs/manifest.json \
            --macro-file /tmp/scan/inputs/macro.joblib \
            --shard-index '${{ matrix.shard }}' \
            --shard-count '${{ needs.discover.outputs.shard_count }}' \
            --output /tmp/scan/partials/shard-${{ matrix.shard }}.joblib
      - name: Upload shard output
        uses: actions/upload-artifact@v4
        with:
          name: scan-partial-${{ matrix.shard }}
          path: /tmp/scan/partials/shard-${{ matrix.shard }}.joblib

  reduce:
    needs: [discover, scan-shard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements-lightgbm-batch.txt
      - name: Download scan inputs
        uses: actions/download-artifact@v4.1.3
        with:
          name: scan-inputs
          path: /tmp/scan/inputs
      - name: Download shard partials
        uses: actions/download-artifact@v4
        with:
          pattern: scan-partial-*
          path: /tmp/scan/partials
          merge-multiple: true
      - name: Merge shard results and send short-term scan email report
        run: |
          python scripts/scan_email_report.py reduce \
            --horizon short_term \
            --manifest-file /tmp/scan/inputs/manifest.json \
            --partial-dir /tmp/scan/partials \
            --run-date '${{ needs.discover.outputs.run_date }}'
      - name: Persist prediction tracker state
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/predictions.json)" ]; then
            echo "No changes to data/predictions.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          git commit -m "chore: update prediction tracker state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto latest and retrying ($attempt/3)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          git push

  notify-on-failure:
    needs: [discover, scan-shard, reduce]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install notifier dependencies
        run: pip install requests
      - name: Send workflow-failure alert
        run: python scripts/notify_workflow_failure.py --workflow "Scan Email Short-Term"
