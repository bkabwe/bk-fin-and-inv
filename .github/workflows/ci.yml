name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  MYPY_PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-api.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python (syntax errors, pyflakes, bugbear, simplify)
        run: ruff check --select E9,F,B,SIM .
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  typecheck:
    # Advisory-only Python type-checking (mypy), scoped to `modules/` via
    # pyproject.toml. Findings are informational and never fail the build
    # (continue-on-error) while type coverage across the codebase matures.
    # Uses a newer Python than the `test`/`lint` jobs because numpy's bundled
    # type stubs use PEP 695 syntax that requires Python 3.12+ to parse.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.MYPY_PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy pandas-stubs types-requests
      - name: Type-check modules/ (advisory, non-blocking)
        run: mypy
