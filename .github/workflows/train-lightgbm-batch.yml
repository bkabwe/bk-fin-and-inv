name: Train LightGBM Batch

on:
  workflow_dispatch:
  schedule:
    # Runs first so discover -> train -> reduce/promote finishes with a buffer
    # before the short-term scan/grading crons read the freshly promoted manifest.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: train-lightgbm-batch
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  MATRIX_JOBS: '4'
  LIGHTGBM_RELEASE_REPOSITORY: ${{ github.repository }}
  POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  SEC_EDGAR_CONTACT_EMAIL: ${{ secrets.SEC_EDGAR_CONTACT_EMAIL }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      batch_id: ${{ steps.batch.outputs.batch_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate batch id
        id: batch
        run: echo "batch_id=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
      - name: Discover trainable tickers and macro inputs
        run: |
          python scripts/lightgbm_batch_pipeline.py discover \
            --output /tmp/lightgbm/discovery.json \
            --macro-output /tmp/lightgbm/shared_macro.joblib \
            --matrix-jobs "$MATRIX_JOBS"
      - name: Upload training inputs
        uses: actions/upload-artifact@v4
        with:
          name: lightgbm-training-inputs
          path: |
            /tmp/lightgbm/discovery.json
            /tmp/lightgbm/shared_macro.joblib

  train:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download training inputs
        uses: actions/download-artifact@v4.1.3
        with:
          name: lightgbm-training-inputs
          path: /tmp/lightgbm/inputs
      - name: Train shard
        run: |
          mkdir -p /tmp/lightgbm/partials
          export SEC_EDGAR_MAX_REQUESTS_PER_SECOND="$(python -c "import os; print(10.0 / max(float(os.environ.get('MATRIX_JOBS', '4')), 1.0))")"
          python scripts/lightgbm_batch_pipeline.py train-shard \
            --discovery-file /tmp/lightgbm/inputs/discovery.json \
            --macro-file /tmp/lightgbm/inputs/shared_macro.joblib \
            --output /tmp/lightgbm/partials/shard-${{ matrix.shard }}.joblib \
            --batch-id '${{ needs.discover.outputs.batch_id }}' \
            --shard-index '${{ matrix.shard }}' \
            --shard-count "$MATRIX_JOBS"
      - name: Upload shard output
        uses: actions/upload-artifact@v4
        with:
          name: lightgbm-partial-${{ matrix.shard }}
          path: /tmp/lightgbm/partials/shard-${{ matrix.shard }}.joblib

  reduce-promote:
    needs: [discover, train]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download training inputs
        uses: actions/download-artifact@v4.1.3
        with:
          name: lightgbm-training-inputs
          path: /tmp/lightgbm/inputs
      - name: Download partial batches
        uses: actions/download-artifact@v4
        with:
          pattern: lightgbm-partial-*
          path: /tmp/lightgbm/partials
          merge-multiple: true
      - name: Merge, validate, and promote
        run: |
          mkdir -p /tmp/lightgbm/output
          python scripts/lightgbm_batch_pipeline.py reduce \
            --partial-dir /tmp/lightgbm/partials \
            --macro-file /tmp/lightgbm/inputs/shared_macro.joblib \
            --output-batch /tmp/lightgbm/output/lightgbm_return_model_batch.joblib \
            --output-manifest /tmp/lightgbm/output/latest.json \
            --batch-id '${{ needs.discover.outputs.batch_id }}' \
            --repository '${{ github.repository }}' \
            --promote
      - name: Upload merged outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightgbm-merged-output
          path: /tmp/lightgbm/output
      - name: Cleanup old promoted releases
        if: success()
        run: |
          python scripts/lightgbm_batch_pipeline.py cleanup \
            --repository '${{ github.repository }}' \
            --keep-promoted-batches 4
